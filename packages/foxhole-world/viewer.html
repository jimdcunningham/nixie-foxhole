<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foxhole Region Viewer</title>
<style>html,body{margin:0;width:100%;height:100%;background:#172329;color:#e2e8e8;font:13px system-ui}canvas{display:block;width:100%;height:100%}aside{position:absolute;top:12px;left:12px;width:250px;background:#172329eb;padding:14px;border:1px solid #4b5859;border-radius:10px}h1{font-size:16px;margin:0 0 12px}label{display:block;margin:10px 0}select,button{background:#303e42;color:inherit;border:1px solid #617176;border-radius:5px;padding:7px}select{width:100%}button{margin:3px}p{line-height:1.5}pre{white-space:pre-wrap;line-height:1.5;font:12px ui-monospace,monospace}#error{color:#ffb9a8}</style></head>
<body><canvas id="canvas"></canvas><aside><h1>Foxhole Region Viewer</h1><label>Region<select id="region"></select></label><label>Renderer<select id="backend"><option value="webgpu">WebGPU</option><option value="webgl">WebGL</option></select></label><button id="overview">Overview</button><button id="town">Town</button><button id="projection">Orthographic</button><button id="reload">Load Region</button><p id="status">Loading region index…</p><p id="error"></p><pre id="metrics"></pre><p>Drag to orbit. Right-drag to pan. Scroll to zoom.</p></aside><script type="module" src="./viewer.mjs"></script></body></html>
